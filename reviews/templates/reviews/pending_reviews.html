{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h2 style="color: white; margin-bottom: 24px;">Pending Reviews ⭐</h2>

    {% if pending_products %}
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; padding: 0;">
        {% for product in pending_products %}
        <div>
            <div class="product-card">
                <a href="{% url 'products:detail' product.slug %}">
                    <img src="{{ product.main_image.url }}" class="product-img" style="height: 180px;">
                </a>
                <h6 style="font-weight: 600; font-size: 14px; min-height: 35px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 8px 0;">{{ product.name }}</h6>
                <a href="{% url 'products:detail' product.slug %}" class="btn-add-cart" style="background: #ff9800; width: 100%; margin-top: auto;">
                    Write Review
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
        <p style="text-align: center; padding: 40px; color: #999;">You have no pending reviews 🎉</p>
    {% endif %}
</div>

{% endblock %}
