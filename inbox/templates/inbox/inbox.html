{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h4 class="fw-bold mb-3">Inbox</h4>

    {% if messages %}
        {% for msg in messages %}
        <div class="p-3 mb-2 rounded shadow-sm {% if not msg.is_read %}bg-light{% endif %}">
            <h6 class="mb-1">{{ msg.title }}</h6>
            <p class="small text-muted">{{ msg.body }}</p>
            <small class="text-muted">{{ msg.created_at|date:"M d, Y" }}</small>
        </div>
        {% endfor %}
    {% else %}
        <p>No messages yet 📭</p>
    {% endif %}
</div>

{% endblock %}
